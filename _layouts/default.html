<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="{{'/assets/css/style.css' | absolute_url}}">
    {% seo %}
  </head>
  <body>
    {% include navigation.html %}
    {{ content }}
    <footer>
      <a href="https://www.facebook.com/stoatsnhoney" class="fa fa-facebook" target="_blank"></a>
      <a href="https://www.linkedin.com/in/jayfriesen/" class="fa fa-linkedin" target="_blank"></a>
      <a href="https://www.youtube.com/@stoatsnhoney" class="fa fa-youtube" target="_blank"></a>
      <a href="https://www.instagram.com/stoatsnhoney/" class="fa fa-instagram" target="_blank"></a>
      <a href="/feed.xml" class="fa fa-rss" target="_blank"></a>
    </footer>
    <!-- Back to Top Button -->
    <button id="backToTop" style="display:none;position:fixed;bottom:40px;right:40px;z-index:1000;padding:12px 18px;font-size:18px;border-radius:50%;background:#222;color:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.2);cursor:pointer;transition:opacity 0.3s;" aria-label="Back to top">↑</button>
    <script>
      const backToTopBtn = document.getElementById('backToTop');
      window.addEventListener('scroll', function() {
        if (window.scrollY > 100) {
          backToTopBtn.style.display = 'block';
          backToTopBtn.style.opacity = '1';
        } else {
          backToTopBtn.style.opacity = '0';
          setTimeout(() => backToTopBtn.style.display = 'none', 300);
        }
      });
      backToTopBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    </script>
  </body>
</html>
