---
layout: default
title: Blog
---
<h1>Film Reviews</h1>

<div class="image-gallery">
  {% assign sorted_films = site.film | sort: "date" | reverse %}
  {% for post in sorted_films %}
    <div class="gallery-item">
      <a href="{{ post.url }}">
        <img src="{{ post.image }}" alt="{{ post.title }} image">
      </a>
      <h2 class="overlay-title">{{ post.title }}</h2>
      <p class="overlay-year">{{ post.release }}</p>
    </div>
  {% endfor %}
</div>

<aside>
  <h2>Film Tags</h2>
  <ul>
    {% for tag in site.data.film_tags %}
      <li><a href="/tags/{{ tag.name | slugify }}">{{ tag.name }}</a></li>
    {% endfor %}
  </ul>
</aside>
